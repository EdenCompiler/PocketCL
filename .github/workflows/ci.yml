name: CI
on:
  push:
  pull_request:
jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test strict C99
        run: make test CC=${{ matrix.compiler }}
      - name: Sanitizers and GC stress
        run: make asan stress
